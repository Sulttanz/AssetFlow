# Add inside an existing TLS-enabled Nginx server block after installing and
# loading the ModSecurity v3 Nginx connector.
modsecurity on;
modsecurity_rules_file /etc/nginx/modsecurity/owasp-crs.conf;

location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Replace inbound forwarding headers at this trusted edge. If another
    # proxy precedes Nginx, trust only its known addresses before doing this.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
