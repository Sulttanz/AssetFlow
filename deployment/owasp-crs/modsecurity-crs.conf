# Example entry point for an installed ModSecurity v3 / OWASP CRS deployment.
# Update these Include paths to match the packages installed on the proxy host.
Include /etc/modsecurity/modsecurity.conf
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/app-crs-exclusions.conf
Include /etc/modsecurity/crs/rules/*.conf

# Override detection-only settings in the packaged baseline so the edge WAF
# actually blocks inbound rule matches. Validate/tune against staging first.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 31457280
SecRequestBodyNoFilesLimit 10485760
SecRequestBodyLimitAction Reject

# Relevant CRS matches are logged with transaction metadata. Deliberately omit
# request/response headers and bodies to avoid saving cookies or credentials.
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsecurity/owasp-crs-audit.json
SecAuditLogParts AHZ
